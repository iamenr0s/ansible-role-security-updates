---
- name: audit_debian | Read the effective apt configuration
  ansible.builtin.command: apt-config dump
  register: __linux_hardening_updates_apt_cfg
  changed_when: false
  check_mode: false

- name: audit_debian | Read the timer states
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  loop: "{{ __linux_hardening_updates_deb_timers }}"
  register: __linux_hardening_updates_timers
  failed_when: false
  check_mode: true

# Each check says whether the host is ok, and what to report when it is not.
- name: audit_debian | Compare with desired state
  ansible.builtin.set_fact:
    linux_hardening_updates_findings: >-
      {{ __linux_hardening_updates_checks | rejectattr('ok') | map(attribute='finding') | list }}
  vars:
    __linux_hardening_updates_cfg: "{{ __linux_hardening_updates_apt_cfg.stdout }}"
    __linux_hardening_updates_lists: >-
      {{ __linux_hardening_updates_cfg | regex_findall('(?m)^APT::Periodic::Update-Package-Lists "(\d+)"')
         | first | default('0') }}
    __linux_hardening_updates_upgrade: >-
      {{ __linux_hardening_updates_cfg | regex_findall('(?m)^APT::Periodic::Unattended-Upgrade "(\d+)"')
         | first | default('0') }}
    __linux_hardening_updates_reboot: >-
      {{ __linux_hardening_updates_cfg | regex_findall('(?m)^Unattended-Upgrade::Automatic-Reboot "(\w+)"')
         | first | default('false') | lower }}
    __linux_hardening_updates_timer_states: >-
      {{ __linux_hardening_updates_timers.results | map(attribute='status.UnitFileState', default='unknown') | list }}
    # The distro's allowed origins are reported, not changed.
    __linux_hardening_updates_open_origins: >-
      {{ __linux_hardening_updates_cfg | regex_findall('(?m)^Unattended-Upgrade::Allowed-Origins:: "(.*)";')
         | reject('search', '(?i)security') | list }}
    __linux_hardening_updates_checks:
      - ok: "{{ 'unattended-upgrades' in ansible_facts['packages'] }}"
        finding:
          key: packages
          expected: "installed: unattended-upgrades"
          actual: "missing: unattended-upgrades"
          fixable: true
      - ok: "{{ __linux_hardening_updates_lists | int == 1 }}"
        finding:
          key: APT::Periodic::Update-Package-Lists
          expected: "1"
          actual: "{{ __linux_hardening_updates_lists }}"
          fixable: true
      - ok: "{{ __linux_hardening_updates_upgrade | int == __linux_hardening_updates_apt_upgrade | int }}"
        finding:
          key: APT::Periodic::Unattended-Upgrade
          expected: "{{ __linux_hardening_updates_apt_upgrade }}"
          actual: "{{ __linux_hardening_updates_upgrade }}"
          fixable: true
      - ok: "{{ __linux_hardening_updates_reboot == __linux_hardening_updates_apt_reboot }}"
        finding:
          key: Unattended-Upgrade::Automatic-Reboot
          expected: "{{ __linux_hardening_updates_apt_reboot }}"
          actual: "{{ __linux_hardening_updates_reboot }}"
          fixable: true
      - ok: "{{ __linux_hardening_updates_timer_states | reject('eq', 'enabled') | list | length == 0 }}"
        finding:
          key: apt timers
          expected: enabled
          actual: >-
            {{ __linux_hardening_updates_deb_timers | zip(__linux_hardening_updates_timer_states)
               | map('join', '=') | join(', ') }}
          fixable: true
      - ok: >-
          {{ not linux_hardening_updates_security_only | bool
             or __linux_hardening_updates_open_origins | length == 0 }}
        finding:
          key: allowed origins
          expected: security origins only
          actual: "{{ __linux_hardening_updates_open_origins | join(', ') }}"
          fixable: false
