---
- name: configure_debian | Install unattended-upgrades
  ansible.builtin.apt:
    name: "{{ __linux_hardening_updates_deb_pkgs }}"
    state: present
    update_cache: true
  register: __linux_hardening_updates_install

- name: configure_debian | Write the unattended-upgrades settings
  ansible.builtin.template:
    src: apt_updates.conf.j2
    dest: "{{ __linux_hardening_updates_dropin }}"
    owner: root
    group: root
    mode: "0644"
    backup: "{{ linux_hardening_backup | bool }}"

# In check mode a package that is not installed yet has no timer unit to enable.
- name: configure_debian | Enable the apt timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ __linux_hardening_updates_deb_timers }}"
  when: not (ansible_check_mode and __linux_hardening_updates_install is changed)
