---
- name: Install unattended-upgrades
  ansible.builtin.package:
    name: unattended-upgrades
    state: present
    update_cache: true

- name: Write the unattended-upgrades settings
  ansible.builtin.template:
    src: apt_updates.conf.j2
    dest: "/etc/apt/apt.conf.d/{{ linux_hardening_updates_dropin_name }}"
    owner: root
    group: root
    mode: "0644"
    backup: "{{ linux_hardening_backup | bool }}"

- name: Enable the apt timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ __linux_hardening_updates_deb_timers }}"
