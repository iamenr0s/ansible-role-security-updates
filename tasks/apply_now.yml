---
# Not idempotent by nature: a later run may find new updates.
- name: apply_now | Check free space before updating
  ansible.builtin.assert:
    that: (1 - item.size_available / item.size_total) * 100 < linux_hardening_updates_max_filesystem_usage
    fail_msg: "{{ item.mount }} is above {{ linux_hardening_updates_max_filesystem_usage }}% usage; not updating."
    quiet: true
  loop: >-
    {{ ansible_facts['mounts']
       | selectattr('mount', 'in', ['/', '/var', '/boot'])
       | selectattr('size_total', 'gt', 0) | list }}
  loop_control:
    label: "{{ item.mount }}"

- name: apply_now | Apply security updates (RedHat family)
  ansible.builtin.dnf:
    name: "*"
    state: latest
    security: true
    update_only: true   # only update what is installed
  when: __linux_hardening_updates_family == 'redhat'

- name: apply_now | Apply updates allowed by unattended-upgrades (Debian family)
  ansible.builtin.command: unattended-upgrade -v
  register: __linux_hardening_updates_apt
  changed_when: >-
    'No packages found' not in __linux_hardening_updates_apt.stdout + __linux_hardening_updates_apt.stderr
  when: __linux_hardening_updates_family == 'debian'
