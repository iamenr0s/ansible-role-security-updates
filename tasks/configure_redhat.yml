---
- name: configure_redhat | Install the automatic updates packages
  ansible.builtin.package:
    name: "{{ __linux_hardening_updates_rpm_pkgs }}"
    state: present
  register: __linux_hardening_updates_install

# Builtin lineinfile, not community.general.ini_file: current community.general needs Python 3.7+ on
# the target, and EL 8's platform Python is 3.6. upgrade_type and apply_updates exist only in [commands].
- name: configure_redhat | Ensure the commands section exists
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    line: "[commands]"
    create: true
    owner: root
    group: root
    mode: "0644"
    backup: "{{ linux_hardening_backup | bool }}"

- name: configure_redhat | Configure dnf automatic
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: "^\\s*{{ item.option }}\\s*="
    line: "{{ item.option }} = {{ item.value }}"
    insertafter: '^\[commands\]'
    create: true   # the file does not exist yet under --check on an unconfigured host
    owner: root
    group: root
    mode: "0644"
    backup: "{{ linux_hardening_backup | bool }}"
  loop:
    - option: upgrade_type
      value: "{{ __linux_hardening_updates_upgrade_type }}"
    - option: apply_updates
      value: "{{ __linux_hardening_updates_apply_updates }}"
  loop_control:
    label: "{{ item.option }}"

# In check mode a package that is not installed yet has no timer unit to enable.
- name: configure_redhat | Enable the automatic updates timer
  ansible.builtin.systemd_service:
    name: "{{ __linux_hardening_updates_rpm_timer }}"
    enabled: true
    state: started
  when: not (ansible_check_mode and __linux_hardening_updates_install is changed)
