---
__linux_hardening_updates_rpm_pkg: "{{ 'dnf5-plugin-automatic' if ansible_facts['distribution'] == 'Fedora' else 'dnf-automatic' }}"
__linux_hardening_updates_rpm_timer: "{{ 'dnf5-automatic.timer' if ansible_facts['distribution'] == 'Fedora' else 'dnf-automatic.timer' }}"
__linux_hardening_updates_deb_timers: [apt-daily.timer, apt-daily-upgrade.timer]
__linux_hardening_updates_family: "{{ 'redhat' if ansible_facts['os_family'] == 'RedHat' else 'debian' }}"
