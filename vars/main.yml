---
__linux_hardening_updates_family: "{{ 'redhat' if ansible_facts['os_family'] == 'RedHat' else 'debian' }}"
__linux_hardening_updates_deb_timers: [apt-daily.timer, apt-daily-upgrade.timer]
# Sorts after the distro's 50unattended-upgrades, so these settings win.
__linux_hardening_updates_dropin: /etc/apt/apt.conf.d/52linux-hardening-updates
